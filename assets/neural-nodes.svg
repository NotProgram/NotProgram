<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="100%" style="background: #090d16; border-radius: 16px; border: 1px solid #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="0.8" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Radial Glow for Core Nodes -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Synapses -->
    <linearGradient id="synapseCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="synapseCoreToOutput" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Grid and Ambience -->
  <rect width="880" height="370" rx="16" fill="#090d16"/>
  <rect width="880" height="370" rx="16" fill="url(#grid)"/>
  <circle cx="440" cy="185" r="220" fill="url(#ambientGlow)"/>

  <!-- Layer Labels Top -->
  <g font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <text x="130" y="38" fill="#38bdf8">LAYER 01 // INGESTION NODES</text>
    <text x="440" y="38" fill="#a855f7">LAYER 02 // SYNAPTIC COGNITIVE ENGINE</text>
    <text x="750" y="38" fill="#22c55e">LAYER 03 // PRODUCTION ACTUATORS</text>
  </g>

  <!-- Connection Paths (Synapses) -->
  <g fill="none" stroke-width="1.6">
    <!-- From Ingestion to Cognitive Engine -->
    <path id="path1" d="M 195 105 C 290 105, 330 145, 395 160" stroke="url(#synapseCyanPurple)" stroke-dasharray="4,4"/>
    <path id="path2" d="M 195 185 C 290 185, 330 185, 395 185" stroke="url(#synapseCyanPurple)" stroke-width="2.2" filter="url(#softGlow)"/>
    <path id="path3" d="M 195 265 C 290 265, 330 225, 395 210" stroke="url(#synapseCyanPurple)" stroke-dasharray="4,4"/>

    <!-- Cross connections within Cognitive Cluster -->
    <path d="M 440 135 L 440 155" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="3,3"/>
    <path d="M 440 215 L 440 240" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="3,3"/>

    <!-- From Cognitive Engine to Output Actuators -->
    <path id="path4" d="M 485 165 C 560 150, 610 105, 680 105" stroke="url(#synapseCoreToOutput)" stroke-width="2" filter="url(#softGlow)"/>
    <path id="path5" d="M 485 185 C 560 185, 610 185, 680 185" stroke="url(#synapseCoreToOutput)" stroke-width="2.2" filter="url(#softGlow)"/>
    <path id="path6" d="M 485 205 C 560 220, 610 265, 680 265" stroke="url(#synapseCoreToOutput)" stroke-width="2" filter="url(#softGlow)"/>
  </g>

  <!-- Animated Action Potential Pulses (Electrons Traveling along Synaptic Paths) -->
  <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 195 105 C 290 105, 330 145, 395 160"/>
  </circle>
  <circle r="4.2" fill="#818cf8" filter="url(#glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 195 185 C 290 185, 330 185, 395 185"/>
  </circle>
  <circle r="3.5" fill="#c084fc" filter="url(#glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 195 265 C 290 265, 330 225, 395 210"/>
  </circle>
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="2.1s" repeatCount="indefinite" path="M 485 165 C 560 150, 610 105, 680 105"/>
  </circle>
  <circle r="4.5" fill="#a855f7" filter="url(#glow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 485 185 C 560 185, 610 185, 680 185"/>
  </circle>
  <circle r="4" fill="#22c55e" filter="url(#glow)">
    <animateMotion dur="2.3s" repeatCount="indefinite" path="M 485 205 C 560 220, 610 265, 680 265"/>
  </circle>

  <!-- ==================== LAYER 1: INGESTION NODES ==================== -->
  <!-- Node 1.1: Webhooks & Events -->
  <g transform="translate(130, 105)">
    <rect x="-65" y="-22" width="130" height="44" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.4" filter="url(#softGlow)"/>
    <circle cx="-42" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-28" y="-3" font-size="11" font-weight="700" fill="#f8fafc">Apple Pay / Hooks</text>
    <text x="-28" y="11" font-size="9" font-weight="500" fill="#94a3b8">REST &amp; Webhooks</text>
  </g>

  <!-- Node 1.2: Multimodal Ingestion -->
  <g transform="translate(130, 185)">
    <rect x="-65" y="-22" width="130" height="44" rx="10" fill="#111827" stroke="#818cf8" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="-42" cy="0" r="6" fill="#818cf8">
      <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-28" y="-3" font-size="11" font-weight="700" fill="#f8fafc">Audio &amp; Vision</text>
    <text x="-28" y="11" font-size="9" font-weight="500" fill="#94a3b8">Voice OCR Signals</text>
  </g>

  <!-- Node 1.3: Flight GDS & APIs -->
  <g transform="translate(130, 265)">
    <rect x="-65" y="-22" width="130" height="44" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.4" filter="url(#softGlow)"/>
    <circle cx="-42" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-28" y="-3" font-size="11" font-weight="700" fill="#f8fafc">Enterprise APIs</text>
    <text x="-28" y="11" font-size="9" font-weight="500" fill="#94a3b8">GDS &amp; Flight Data</text>
  </g>

  <!-- ==================== LAYER 2: COGNITIVE CENTRAL ENGINE ==================== -->
  <!-- Top Auxiliary Node: Symfony & Python Core -->
  <g transform="translate(440, 105)">
    <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="0" y="4" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ PHP (Symfony) • Python (FastAPI)</text>
  </g>

  <!-- Central Synaptic Nucleus: Autonomous AI Orchestrator -->
  <g transform="translate(440, 185)">
    <!-- Outer Pulsing Aura -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="42" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="36" fill="url(#ambientGlow)"/>
    
    <!-- Central Brain Icon / Text -->
    <text x="0" y="-8" font-size="18" text-anchor="middle">🧠</text>
    <text x="0" y="8" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AGENTIC AI</text>
    <text x="0" y="20" font-size="8" font-weight="600" fill="#c084fc" text-anchor="middle">Gemini • n8n • LLM</text>
  </g>

  <!-- Bottom Auxiliary Node: Knowledge & State Graph -->
  <g transform="translate(440, 265)">
    <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
    <text x="0" y="4" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">💾 PostgreSQL • Sheets • Vector DB</text>
  </g>

  <!-- ==================== LAYER 3: PRODUCTION ACTUATORS ==================== -->
  <!-- Node 3.1: Aviatur Flight Quoter -->
  <g transform="translate(750, 105)">
    <rect x="-70" y="-22" width="140" height="44" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.6" filter="url(#softGlow)"/>
    <circle cx="-46" cy="0" r="5" fill="#38bdf8"/>
    <text x="-32" y="-3" font-size="11" font-weight="700" fill="#f8fafc">Aviatur Flight Agent</text>
    <text x="-32" y="11" font-size="9" font-weight="500" fill="#38bdf8">✈️ Autonomous Quoter</text>
  </g>

  <!-- Node 3.2: StrategonAI SMB Automation -->
  <g transform="translate(750, 185)">
    <rect x="-70" y="-22" width="140" height="44" rx="10" fill="#111827" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-46" cy="0" r="6" fill="#a855f7">
      <animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="-32" y="-3" font-size="11" font-weight="700" fill="#f8fafc">StrategonAI Core</text>
    <text x="-32" y="11" font-size="9" font-weight="500" fill="#c084fc">🚀 LatAm SMB Workflows</text>
  </g>

  <!-- Node 3.3: Autonomous Personal CFO -->
  <g transform="translate(750, 265)">
    <rect x="-70" y="-22" width="140" height="44" rx="10" fill="#111827" stroke="#22c55e" stroke-width="1.6" filter="url(#softGlow)"/>
    <circle cx="-46" cy="0" r="5" fill="#22c55e"/>
    <text x="-32" y="-3" font-size="11" font-weight="700" fill="#f8fafc">AI Personal CFO</text>
    <text x="-32" y="11" font-size="9" font-weight="500" fill="#22c55e">💎 Guardian &amp; Mini App</text>
  </g>

  <!-- Status Bar Footer -->
  <g transform="translate(440, 335)" font-size="10" font-weight="600" text-anchor="middle">
    <text fill="#64748b">
      SYNAPTIC NETWORK STATUS: <tspan fill="#22c55e">● ACTIVE</tspan> | LATENCY: <tspan fill="#38bdf8">0.042 ms</tspan> | ARCHITECTURE: <tspan fill="#c084fc">NEURAL-AGENTIC HYBRID</tspan>
    </text>
  </g>
</svg>
