<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%" style="background: #000000; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Apple Glass Gradient Surfaces -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="centerGlassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Radial White Ambient Lighting -->
    <radialGradient id="ambientLighting" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Monochromatic Blur Filter -->
    <filter id="whiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="880" height="320" rx="20" fill="#000000"/>
  
  <!-- Subtle Grid Floor for Spatial Depth -->
  <g opacity="0.18">
    <line x1="40" y1="80" x2="840" y2="80" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,6"/>
    <line x1="40" y1="160" x2="840" y2="160" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,6"/>
    <line x1="40" y1="240" x2="840" y2="240" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,6"/>
  </g>

  <!-- Ambient Light Sphere at Center -->
  <circle cx="440" cy="160" r="240" fill="url(#ambientLighting)"/>

  <!-- Delicate Monochromatic Synaptic Curves -->
  <g fill="none" stroke-linecap="round">
    <path d="M 230 115 C 320 115, 340 145, 385 155" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>
    <path d="M 230 160 C 310 160, 330 160, 385 160" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.4" filter="url(#softGlow)"/>
    <path d="M 230 205 C 320 205, 340 175, 385 165" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>

    <path d="M 495 155 C 540 145, 560 115, 650 115" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>
    <path d="M 495 160 C 560 160, 580 160, 650 160" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.4" filter="url(#softGlow)"/>
    <path d="M 495 165 C 540 175, 560 205, 650 205" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>
  </g>

  <!-- Animated Monochromatic Energy Photons -->
  <circle r="2.5" fill="#ffffff" filter="url(#whiteGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 230 115 C 320 115, 340 145, 385 155"/>
  </circle>
  <circle r="3" fill="#ffffff" filter="url(#whiteGlow)">
    <animateMotion dur="2.0s" repeatCount="indefinite" path="M 230 160 C 310 160, 330 160, 385 160"/>
  </circle>
  <circle r="2.5" fill="#ffffff" filter="url(#whiteGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 230 205 C 320 205, 340 175, 385 165"/>
  </circle>
  <circle r="2.5" fill="#ffffff" filter="url(#whiteGlow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 495 155 C 540 145, 560 115, 650 115"/>
  </circle>
  <circle r="3" fill="#ffffff" filter="url(#whiteGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 495 160 C 560 160, 580 160, 650 160"/>
  </circle>
  <circle r="2.5" fill="#ffffff" filter="url(#whiteGlow)">
    <animateMotion dur="2.7s" repeatCount="indefinite" path="M 495 165 C 540 175, 560 205, 650 205"/>
  </circle>

  <!-- ==================== FROSTED GLASS CARDS ==================== -->

  <!-- CARD 1: SENSORY & ENTERPRISE INGESTION (LEFT) -->
  <g transform="translate(70, 75)">
    <rect width="160" height="170" rx="16" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
    <!-- Specular Highlight Line at Top -->
    <path d="M 12 1 L 148 1" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" stroke-linecap="round"/>
    
    <text x="20" y="32" font-size="10" font-weight="700" fill="#86868b" letter-spacing="1.5">01 // INGESTION</text>
    <text x="20" y="54" font-size="14" font-weight="600" fill="#ffffff">Enterprise Core</text>
    
    <g transform="translate(20, 78)">
      <circle cx="4" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
      <text x="14" y="3" font-size="11" fill="#d2d2d7">Flight GDS APIs</text>
    </g>
    <g transform="translate(20, 106)">
      <circle cx="4" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
      <text x="14" y="3" font-size="11" fill="#d2d2d7">Multimodal Audio / OCR</text>
    </g>
    <g transform="translate(20, 134)">
      <circle cx="4" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
      <text x="14" y="3" font-size="11" fill="#d2d2d7">Event Webhooks</text>
    </g>
  </g>

  <!-- CARD 2: NEURAL ENGINE & ORCHESTRATION (CENTER HERO) -->
  <g transform="translate(350, 60)">
    <rect width="180" height="200" rx="18" fill="url(#centerGlassFill)" stroke="url(#glassBorder)" stroke-width="1.2" filter="url(#softGlow)"/>
    <!-- Top Specular Glass Reflection -->
    <path d="M 16 1 L 164 1" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Central Halo -->
    <circle cx="90" cy="65" r="36" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" stroke-dasharray="4,4">
      <animateTransform attributeName="transform" type="rotate" from="0 90 65" to="360 90 65" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="65" r="26" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.2"/>
    <circle cx="90" cy="65" r="6" fill="#ffffff" filter="url(#whiteGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <text x="90" y="122" font-size="10" font-weight="700" fill="#86868b" letter-spacing="1.5" text-anchor="middle">02 // COGNITIVE CORE</text>
    <text x="90" y="142" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.3">Neural Engine</text>
    
    <g font-size="11" fill="#a1a1a6" text-anchor="middle">
      <text x="90" y="166">Autonomous LLM Swarms</text>
      <text x="90" y="184">n8n • Symfony • FastAPI</text>
    </g>
  </g>

  <!-- CARD 3: PRODUCTION ACTUATORS (RIGHT) -->
  <g transform="translate(650, 75)">
    <rect width="160" height="170" rx="16" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
    <!-- Specular Highlight Line at Top -->
    <path d="M 12 1 L 148 1" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" stroke-linecap="round"/>

    <text x="20" y="32" font-size="10" font-weight="700" fill="#86868b" letter-spacing="1.5">03 // DEPLOYMENTS</text>
    <text x="20" y="54" font-size="14" font-weight="600" fill="#ffffff">Live Actuators</text>

    <g transform="translate(20, 78)">
      <circle cx="4" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
      <text x="14" y="3" font-size="11" fill="#d2d2d7">Aviatur Flight Agent</text>
    </g>
    <g transform="translate(20, 106)">
      <circle cx="4" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
      <text x="14" y="3" font-size="11" fill="#d2d2d7">StrategonAI Workflows</text>
    </g>
    <g transform="translate(20, 134)">
      <circle cx="4" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
      <text x="14" y="3" font-size="11" fill="#d2d2d7">Autonomous CFO</text>
    </g>
  </g>

  <!-- Top Subtle Brand Bar -->
  <g transform="translate(440, 32)" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle" fill="#6e6e73">
    <text>NEURAL NETWORK ARCHITECTURE • MINIMALIST SYSTEMS</text>
  </g>

  <!-- Bottom Spec Status Bar -->
  <g transform="translate(440, 296)" font-size="10" font-weight="500" letter-spacing="0.5" text-anchor="middle" fill="#86868b">
    <text>
      HIGH-CONCURRENCY BACKEND <tspan fill="#48484a">|</tspan>
      AUTONOMOUS AGENT ORCHESTRATION <tspan fill="#48484a">|</tspan>
      ARCH LINUX ENVIRONMENT
    </text>
  </g>
</svg>
